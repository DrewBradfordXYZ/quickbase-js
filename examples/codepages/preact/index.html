<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What changed? (Preact)</title>
  <script src="https://cdn.jsdelivr.net/npm/quickbase-js@3/dist/quickbase.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #677085;
      --border: #e3e6ec; --accent: #2563eb; --on-accent: #fff; --accent-soft: #e8efff; --warn: #9a5b00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b; --card: #1b1f27; --text: #e6e9ef; --muted: #959db0;
        --border: #2c323d; --accent: #7aa2ff; --on-accent: #0b1220; --accent-soft: #1f2a44; --warn: #e0a84a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 680px; margin: 0 auto; }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: var(--muted); margin: 2px 0 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    button, select { font: inherit; color: inherit; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    .toggle button { border: 0; border-radius: 0; }
    .toggle button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
    .banner { width: 100%; margin-bottom: 12px; background: var(--accent-soft); color: var(--accent);
      border-color: transparent; font-weight: 600; }
    ul { list-style: none; margin: 0; padding: 0; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; }
    li { padding: 12px 16px; border-top: 1px solid var(--border); }
    li:first-child { border-top: 0; }
    li a { color: var(--accent); font-weight: 600; text-decoration: none; }
    li a:hover { text-decoration: underline; }
    .meta { color: var(--muted); font-size: 13px; }
    .status { color: var(--muted); padding: 24px 0; text-align: center; }
    .notice { color: var(--warn); font-size: 13px; margin-top: 12px; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ---- QuickBase: the same in every example ----------------------------
    // Everything QuickBase-specific is here; the next script is the page.

    const realm = location.hostname.split('.')[0];
    const appId = location.pathname.match(/\/(?:db|nav\/app)\/([a-z0-9]+)/i)?.[1];

    const qb = QuickBase.createClient({
      realm,
      auth: { type: 'temp-token' }, // the signed-in user's session: no token in the page
      readOnly: true,               // the client refuses every write before sending it
      rateLimit: { proactiveThrottle: { enabled: true } }, // big apps stay under 100 requests / 10 s
    });

    // Built-in fields every QuickBase table has.
    const F = { created: 1, modified: 2, recordId: 3, modifiedBy: 5 };
    const PER_TABLE = 5;
    const FEED_SIZE = 30;

    // The latest changes in each table, merged into one feed, newest first.
    async function loadFeed(tables, { mine }) {
      const blocked = [];
      const perTable = await Promise.all(tables.map(async (table) => {
        try {
          const { data = [] } = await qb.runQuery({
            from: table.id,
            select: Object.values(F),
            where: mine ? `{${F.modifiedBy}.EX._curuser_}` : undefined,
            sortBy: [{ fieldId: F.modified, order: 'DESC' }],
            options: { top: PER_TABLE },
          });
          return data.map((record) => toItem(table, record));
        } catch (error) {
          // A table this user can't read is skipped, not fatal.
          if (error instanceof QuickBase.AuthorizationError || error instanceof QuickBase.AuthenticationError) {
            blocked.push(table.name);
            return [];
          }
          throw error;
        }
      }));
      const items = perTable.flat().sort((a, b) => b.when - a.when).slice(0, FEED_SIZE);
      return { items, blocked };
    }

    function toItem(table, record) {
      const rid = record[F.recordId]?.value;
      const created = new Date(record[F.created]?.value);
      const when = new Date(record[F.modified]?.value);
      const user = record[F.modifiedBy]?.value;
      return {
        key: `${table.id}:${rid}`,
        tableId: table.id,
        title: `${table.singleRecordName || table.name} #${rid}`,
        action: when - created < 1000 ? 'created' : 'updated',
        when,
        who: user?.name || user?.email || 'someone',
        url: `/db/${table.id}?a=dr&rid=${rid}`,
      };
    }

    function timeAgo(date) {
      const s = (Date.now() - date) / 1000;
      if (s < 60) return 'just now';
      if (s < 3600) return `${Math.floor(s / 60)} min ago`;
      if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
      if (s < 7 * 86400) return `${Math.floor(s / 86400)} d ago`;
      return date.toLocaleDateString();
    }

    // How many items are newer than the newest one on screen.
    const countNewer = (items, newest) => items.filter((i) => !newest || i.when > newest).length;

    function errorMessage(error) {
      if (error instanceof QuickBase.RateLimitError) return 'QuickBase is busy. Try again in a minute.';
      if (error instanceof QuickBase.AuthenticationError) return 'Sign in to QuickBase to see this page.';
      if (error instanceof TypeError) return 'Can’t reach QuickBase. Check your connection.'; // fetch failed
      return error.message;
    }

  </script>

  <script type="module">
    // ---- The page: Preact, with htm for JSX-like templates (no build step) ----
    import { html, render, useState, useEffect, useRef } from 'https://cdn.jsdelivr.net/npm/htm@3/preact/standalone.module.js';

    function App() {
      const [tables, setTables] = useState([]);
      const [feed, setFeed] = useState(null);       // { items, blocked }
      const [pending, setPending] = useState(null); // a newer feed, waiting for a click
      const [mine, setMine] = useState(false);
      const [tableId, setTableId] = useState('');
      const [error, setError] = useState(null);
      const shownFeed = useRef(null);
      shownFeed.current = feed;

      // background: the timer's refresh, which holds new changes behind the banner.
      async function refresh({ spinner = false, background = false } = {}) {
        if (spinner) setFeed(null);
        try {
          const next = await loadFeed(tables, { mine });
          const shown = shownFeed.current;
          if (background && shown?.items.length && countNewer(next.items, shown.items[0].when)) {
            setPending(next);
          } else {
            setFeed(next);
            setPending(null);
          }
          setError(null);
        } catch (e) {
          setError(errorMessage(e));
        }
      }

      useEffect(() => {
        if (appId) qb.getAppTables({ appId }).then(setTables, (e) => setError(errorMessage(e)));
      }, []);

      useEffect(() => {
        if (!tables.length) return;
        refresh({ spinner: true });
        const timer = setInterval(() => refresh({ background: true }), 60_000);
        return () => clearInterval(timer);
      }, [tables, mine]);

      if (!appId) {
        return html`<main><h1>What changed?</h1><p class="sub">Open this page as a code page inside a QuickBase app.</p></main>`;
      }

      const shown = feed?.items.filter((i) => !tableId || i.tableId === tableId) ?? [];
      const newer = pending ? countNewer(pending.items, feed?.items[0]?.when) : 0;

      return html`
        <main>
          <h1>What changed?</h1>
          <p class="sub">${tables.length ? `Latest changes across ${tables.length} tables` : 'Loading…'}</p>
          <div class="controls">
            <div class="toggle">
              <button aria-pressed=${String(!mine)} onClick=${() => setMine(false)}>Everyone</button>
              <button aria-pressed=${String(mine)} onClick=${() => setMine(true)}>Just me</button>
            </div>
            <select value=${tableId} onChange=${(e) => setTableId(e.target.value)}>
              <option value="">All tables</option>
              ${tables.map((t) => html`<option key=${t.id} value=${t.id}>${t.name}</option>`)}
            </select>
            <button onClick=${() => refresh()}>Refresh</button>
          </div>
          ${newer > 0 && html`
            <button class="banner" onClick=${() => { setFeed(pending); setPending(null); }}>
              ${newer} new change${newer === 1 ? '' : 's'}, show
            </button>`}
          ${error ? html`<p class="status error">${error}</p>`
            : !feed ? html`<p class="status">Loading…</p>`
            : shown.length ? html`
              <ul>
                ${shown.map((i) => html`
                  <li key=${i.key}>
                    <a href=${i.url} target="_top">${i.title}</a>
                    <div class="meta">${i.action} ${timeAgo(i.when)} by ${i.who}</div>
                  </li>`)}
              </ul>`
            : html`<p class="status">No changes yet.</p>`}
          ${feed?.blocked.length > 0 && html`<p class="notice">No access to: ${feed.blocked.join(', ')}</p>`}
        </main>`;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
